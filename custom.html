<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahityaBitt | Custom Orders</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">SahityaBitt.</a>
        <ul class="nav-links">
            <li><a href="poetries.html">Poetries</a></li>
            <li><a href="stories.html">Stories</a></li>
            
            <li><a href="custom.html" style="color: var(--accent-color);">Custom Orders</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="container">
        <h2 class="section-title">Order Custom Pieces</h2>
        <div class="form-container">
            <p style="text-align:center; margin-bottom: 2rem;">Want a poem written for a loved one? Or a story based on a memory? Fill out the form below.</p>
            
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label>Type of Work</label>
                    <select>
                        <option>Poetry</option>
                        <option>Short Story</option>
                        <option>Letter</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Theme / Key Elements</label>
                    <textarea rows="5" placeholder="Describe the mood, topic, or specific details..."></textarea>
                </div>
                <button type="submit" class="btn">Submit Request</button>
            </form>
        </div>
    </section>

    <footer>
        <div class="logo">SahityaBitt.</div>
        <p>&copy; 2026 SahityaBitt.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
