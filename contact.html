<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahityaBitt | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <a href="index.html" class="logo">SahityaBitt.</a>
        <ul class="nav-links">
            <li><a href="poetries.html">Poetries</a></li>
            <li><a href="stories.html">Stories</a></li>
            
            <li><a href="custom.html">Custom Orders</a></li>
            <li><a href="contact.html" style="color: var(--accent-color);">Contact</a></li>
        </ul>
    </nav>

    <section class="container">
        <h2 class="section-title">Get in Touch</h2>
        <div class="form-container">
            <form>
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" placeholder="Your Name">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="Your Email">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="Say hello..."></textarea>
                </div>
                <button type="submit" class="btn">Send Message</button>
            </form>

            <div class="social-links" style="margin-top: 3rem;">
                <a href="https://www.instagram.com">Instagram</a>
                <a href="https://www.X.com">X</a>
                <a href="https://www.facebook.com">Facebook</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="logo">SahityaBitt.</div>
        <p>&copy; 2026 SahityaBitt.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
